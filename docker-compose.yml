services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marcasautos}
      POSTGRES_USER: ${POSTGRES_USER:-marcas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marcas_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/MarcasAutos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-marcasautos};Username=${POSTGRES_USER:-marcas};Password=${POSTGRES_PASSWORD:-marcas_local}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
